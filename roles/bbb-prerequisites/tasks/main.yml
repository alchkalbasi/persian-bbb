- name: Ensure required ports are open (UFW)
  ansible.builtin.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
  when: ansible_facts['os_family'] == "Debian"

- name: Allow UDP ports for media (FreeSWITCH, mediasoup)
  ansible.builtin.ufw:
    rule: allow
    port: "16384:32768"
    proto: udp
  when: ansible_facts['os_family'] == "Debian"

- name: Enable UFW if not already enabled
  ansible.builtin.ufw:
    state: enabled
    policy: deny
  when: ansible_facts['os_family'] == "Debian"