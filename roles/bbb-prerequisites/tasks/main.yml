---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - software-properties-common
      - net-tools
    state: present

- name: Set system hostname
  ansible.builtin.hostname:
    name: "{{ bbb_hostname }}"
  when: bbb_hostname is defined

- name: Add hostname to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ bbb_hostname }}"
    state: present
  when: bbb_hostname is defined

